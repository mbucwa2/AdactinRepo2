name: Playwright Tests with Xray Import

on:
  workflow_dispatch:
    inputs:
      test_exec_key:
        description: 'Test Execution Key'
        required: false
        default: 'ILABACCEL-1566'

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm test
        continue-on-error: true

      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Xray Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xray-report
          path: results/xray-report.xml
          retention-days: 30

      - name: Validate secrets and import to Xray
        if: always()
        run: |
          set -e
          
          # Validate secrets are not empty
          if [ -z "${{ secrets.XRAY_CLIENT_ID }}" ]; then
            echo "Error: XRAY_CLIENT_ID secret is empty"
            exit 1
          fi
          
          if [ -z "${{ secrets.XRAY_CLIENT_SECRET }}" ]; then
            echo "Error: XRAY_CLIENT_SECRET secret is empty"
            exit 1
          fi
          
          # Authenticate to Xray Cloud
          TOKEN_RESPONSE=$(curl -s -X POST "https://xray.cloud.getxray.app/api/v2/authenticate" \
            -H "Content-Type: application/json" \
            -d "{\"client_id\": \"${{ secrets.XRAY_CLIENT_ID }}\", \"client_secret\": \"${{ secrets.XRAY_CLIENT_SECRET }}\"}")
          
          # Extract token and remove quotes
          TOKEN=$(echo "$TOKEN_RESPONSE" | tr -d '"')
          
          if [ -z "$TOKEN" ]; then
            echo "Error: Failed to obtain Xray authentication token"
            exit 1
          fi
          
          # Import JUnit results to Xray
          IMPORT_RESPONSE=$(curl -s -X POST "https://xray.cloud.getxray.app/api/v2/import/execution/junit?projectKey=ILABACCEL&testExecKey=${{ inputs.test_exec_key }}" \
            -H "Authorization: Bearer $TOKEN" \
            -F "file=@results/xray-report.xml")
          
          # Check if import was successful
          if echo "$IMPORT_RESPONSE" | grep -q "error\|Error"; then
            echo "Error: Xray import rejected"
            exit 1
          fi
